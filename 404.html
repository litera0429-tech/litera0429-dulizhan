<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>页面不存在 · 肘子鱼</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f2ef;
      color: #1a1a1a;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0c0c0c; color: #f2f2ef; }
    }
    .box { text-align: center; padding: 40px 24px; }
    .code { font-size: 72px; font-weight: 200; letter-spacing: 4px; margin: 0 0 12px; }
    .msg { font-size: 16px; opacity: .75; margin: 0 0 28px; }
    a { color: inherit; text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <p class="msg">页面不存在或已移动</p>
    <a href="/">返回首页</a>
  </div>
</body>
</html>
