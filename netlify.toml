# 肘子鱼独立站 · Netlify 静态部署配置
[build]
  publish = "."

# 图片/视频改由 OSS 提供：前端路径保持 images/... 与 cover.mp4 不变，
# 这里 301 直连跳转到 OSS，浏览器直接访问阿里云，不再经 Netlify 中转
[[redirects]]
  from = "/images/*"
  to = "https://litera0429.oss-cn-hangzhou.aliyuncs.com/images/:splat"
  status = 301

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
