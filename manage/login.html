<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>管理员登录 · 肘子鱼</title>
  <script>
    (function () {
      var pref = null;
      try { pref = localStorage.getItem("zzTheme"); } catch (e) {}
      var theme;
      if (pref === "light" || pref === "dark") {
        theme = pref;
      } else {
        var h = new Date().getHours();
        theme = h >= 6 && h < 17 ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      --bg: #0c0c0c;
      --bg-soft: #141414;
      --bg-elev: #1b1b1b;
      --text: #f2f2ef;
      --dim: #a5a5a1;
      --faint: #6e6e6a;
      --line: rgba(255, 255, 255, 0.1);
      --danger: #d98c8c;
      --ok: #7cc9a4;
      --accent: #93b0ff;
      --accent-soft: rgba(147, 176, 255, 0.16);
      --spot: rgba(255, 255, 255, 0.09);
      --shimmer: rgba(20, 20, 18, 0.16);
      --orb-a: rgba(96, 120, 255, 0.20);
      --orb-b: rgba(255, 150, 110, 0.13);
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --bg-soft: #fafafa;
      --bg-elev: #f5f5f3;
      --text: #191917;
      --dim: #575750;
      --faint: #8f8f87;
      --line: rgba(20, 20, 18, 0.12);
      --danger: #b35555;
      --ok: #1f8a5b;
      --accent: #4568ff;
      --accent-soft: rgba(69, 104, 255, 0.12);
      --spot: rgba(20, 20, 18, 0.05);
      --shimmer: rgba(255, 255, 255, 0.32);
      --orb-a: rgba(69, 104, 255, 0.12);
      --orb-b: rgba(240, 160, 90, 0.11);
      color-scheme: light;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB",
        "Segoe UI", Roboto, "Helvetica Neue", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      padding: 24px;
      overflow: hidden;
    }
    .bg-fx {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      animation: bg-in 1.4s ease 0.1s both;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      will-change: transform;
    }
    .orb.a {
      width: 52vmax;
      height: 52vmax;
      left: -16vmax;
      top: -18vmax;
      background: radial-gradient(circle at 35% 35%, var(--orb-a), transparent 66%);
      animation: drift-a 30s ease-in-out infinite alternate;
    }
    .orb.b {
      width: 44vmax;
      height: 44vmax;
      right: -14vmax;
      bottom: -16vmax;
      background: radial-gradient(circle at 60% 60%, var(--orb-b), transparent 66%);
      animation: drift-b 36s ease-in-out infinite alternate;
    }
    @keyframes bg-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes drift-a {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to   { transform: translate3d(6vmax, 4vmax, 0) scale(1.12); }
    }
    @keyframes drift-b {
      from { transform: translate3d(0, 0, 0) scale(1.08); }
      to   { transform: translate3d(-5vmax, -3vmax, 0) scale(1); }
    }
    .stage { position: relative; z-index: 1; width: min(400px, 100%); }
    .card {
      position: relative;
      overflow: hidden;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 38px 34px 32px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      animation: card-in 1s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: border-color 0.45s ease, box-shadow 0.45s ease;
    }
    .card.ok {
      border-color: rgba(124, 201, 164, 0.55);
      box-shadow: 0 0 0 1px rgba(124, 201, 164, 0.35),
        0 24px 70px rgba(0, 0, 0, 0.34),
        0 0 46px rgba(124, 201, 164, 0.22);
    }
    .card.settled { animation: none; }
    .card.shake { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
    @keyframes card-in {
      0%   { opacity: 0; transform: translateY(26px) scale(0.98); filter: blur(12px); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }
    @keyframes shake {
      10%, 90% { transform: translateX(-1px); }
      20%, 80% { transform: translateX(2px); }
      30%, 50%, 70% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }
    .card > *:not(.spot) { animation: rise-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .card > *:nth-child(2) { animation-delay: 0.12s; }
    .card > *:nth-child(3) { animation-delay: 0.18s; }
    .card > *:nth-child(4) { animation-delay: 0.24s; }
    .card > *:nth-child(5) { animation-delay: 0.3s; }
    .card > *:nth-child(6) { animation-delay: 0.36s; }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    .spot {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
      background: radial-gradient(240px circle at var(--mx, 50%) var(--my, 0%), var(--spot), transparent 72%);
    }
    .card.spot-on .spot { opacity: 1; }
    .brand {
      font-size: 12px;
      letter-spacing: 0.22em;
      color: var(--faint);
      text-transform: uppercase;
      animation: brand-in 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.06s both;
    }
    @keyframes brand-in {
      from { opacity: 0; transform: translateY(10px); letter-spacing: 0.5em; filter: blur(8px); }
      to   { opacity: 1; transform: none; letter-spacing: 0.22em; filter: none; }
    }
    h1 { font-size: 22px; font-weight: 500; letter-spacing: 0.06em; margin: 8px 0 4px; }
    .sub { font-size: 13px; color: var(--dim); margin-bottom: 26px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: var(--dim); letter-spacing: 0.08em; margin-bottom: 7px; }
    .pwd-wrap { position: relative; }
    .pwd-wrap input {
      width: 100%;
      padding: 11px 52px 11px 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
    }
    .pwd-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft), 0 8px 30px rgba(0, 0, 0, 0.14);
    }
    .pwd-wrap input.err { border-color: var(--danger); box-shadow: 0 0 0 3px rgba(217, 140, 140, 0.18); }
    .pwd-wrap input::placeholder { color: var(--faint); }
    .toggle {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--faint);
      font-size: 12px;
      padding: 6px 8px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.05em;
      transition: color 0.25s ease, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toggle:hover { color: var(--dim); transform: translateY(-50%) scale(1.05); }
    .error {
      min-height: 20px;
      font-size: 13px;
      color: var(--danger);
      margin: 2px 0 12px;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .error.in { animation: err-in 0.38s cubic-bezier(0.16, 1, 0.3, 1) both; }
    @keyframes err-in {
      from { opacity: 0; transform: translateY(4px); filter: blur(3px); }
      to   { opacity: 1; transform: none; filter: none; }
    }
    .btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      letter-spacing: 0.16em;
      color: var(--bg);
      background: var(--text);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 0.35s ease, background-color 0.35s ease, opacity 0.3s ease;
    }
    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 25%, var(--shimmer) 50%, transparent 75%);
      transform: translateX(-130%);
      transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .btn:hover::before { transform: translateX(130%); }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(0, 0, 0, 0.18), 0 0 0 1px var(--accent-soft); }
    .btn:active { transform: translateY(0) scale(0.985); }
    .btn:disabled { opacity: 0.55; cursor: default; transform: none; }
    .btn.ok { background: var(--ok); color: #fff; }
    .btn-label { position: relative; z-index: 1; display: inline-flex; align-items: center; justify-content: center; }
    .spin {
      display: inline-block;
      width: 13px;
      height: 13px;
      margin-right: 9px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .foot { margin-top: 22px; text-align: center; font-size: 12px; color: var(--faint); }
    .foot a {
      position: relative;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.25s ease;
    }
    .foot a::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .foot a:hover { color: var(--text); }
    .foot a:hover::after { transform: scaleX(1); transform-origin: left; }
    .no-anim, .no-anim * { transition: none !important; animation: none !important; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="orb a"></div>
    <div class="orb b"></div>
  </div>
  <main class="stage">
    <div class="card" id="card">
      <div class="spot" id="spot" aria-hidden="true"></div>
      <div class="brand">肘子鱼 · IMMERSIVE</div>
      <h1>管理后台</h1>
      <p class="sub">请输入管理员密码</p>
      <form id="loginForm" autocomplete="off" novalidate>
        <div class="field">
          <label for="password">密码</label>
          <div class="pwd-wrap">
            <input type="password" id="password" placeholder="管理员密码" autocomplete="current-password" required>
            <button type="button" class="toggle" id="toggleBtn" aria-label="显示/隐藏密码">显示</button>
          </div>
        </div>
        <p class="error" id="error" role="alert"></p>
        <button class="btn" id="submitBtn" type="submit">
          <span class="btn-label">登 录</span>
        </button>
      </form>
      <p class="foot"><a href="../">返回网站首页</a></p>
    </div>
  </main>
  <script>
    (function () {
      var form = document.getElementById("loginForm");
      var pwd = document.getElementById("password");
      var err = document.getElementById("error");
      var btn = document.getElementById("submitBtn");
      var btnLabel = btn.querySelector(".btn-label");
      var card = document.getElementById("card");
      var toggleBtn = document.getElementById("toggleBtn");

      /* 鼠标跟随微光（仅精确指针设备） */
      if (window.matchMedia && window.matchMedia("(pointer: fine)").matches) {
        card.addEventListener("pointermove", function (e) {
          var r = card.getBoundingClientRect();
          card.style.setProperty("--mx", (e.clientX - r.left).toFixed(1) + "px");
          card.style.setProperty("--my", (e.clientY - r.top).toFixed(1) + "px");
          card.classList.add("spot-on");
        });
        card.addEventListener("pointerleave", function () {
          card.classList.remove("spot-on");
        });
      }

      function showError(msg) {
        err.textContent = msg;
        err.classList.remove("in");
        void err.offsetWidth;
        err.classList.add("in");
        pwd.classList.add("err");
        card.classList.add("settled");
        card.classList.remove("shake");
        void card.offsetWidth;
        card.classList.add("shake");
        card.addEventListener("animationend", function onEnd(e) {
          if (e.animationName !== "shake") return;
          card.classList.remove("shake");
          card.removeEventListener("animationend", onEnd);
        });
      }

      toggleBtn.addEventListener("click", function () {
        var show = pwd.type === "password";
        pwd.type = show ? "text" : "password";
        toggleBtn.textContent = show ? "隐藏" : "显示";
      });

      /* 重新输入时自动清除红色边框与错误提示：完全无动画，瞬间恢复 */
      pwd.addEventListener("input", function () {
        if (!err.textContent && !pwd.classList.contains("err")) return;
        card.classList.add("no-anim");
        err.textContent = "";
        err.classList.remove("in");
        pwd.classList.remove("err");
        void card.offsetWidth;
        card.classList.remove("no-anim");
      });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        err.textContent = "";
        err.classList.remove("in");
        pwd.classList.remove("err");
        var value = pwd.value;
        if (!value) { showError("请输入密码"); pwd.focus(); return; }
        btn.disabled = true;
        btn.classList.remove("ok");
        btnLabel.innerHTML = '<span class="spin" aria-hidden="true"></span>登录中…';
        fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: value })
        })
          .then(function (r) {
            if (r.status === 200) {
              btnLabel.innerHTML = "✓ 已登录";
              btn.classList.add("ok");
              card.classList.add("ok");
              setTimeout(function () { location.href = "/manage/"; }, 520);
              return;
            }
            return r.json().then(function (d) {
              throw new Error((d && d.error) || "登录失败，请重试");
            });
          })
          .catch(function (ex) {
            btn.disabled = false;
            btnLabel.textContent = "登 录";
            showError(ex && ex.message ? ex.message : "无法连接服务器");
            pwd.select();
          });
      });
    })();
  </script>
</body>
</html>
